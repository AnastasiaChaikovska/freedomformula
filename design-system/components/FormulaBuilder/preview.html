  </div>
</div></div><script>
(function () {
  document.querySelectorAll('.ff-builder').forEach(function (b) {
    var out = b.querySelector('.ff-formula');
    function term(btn, key) {
      var s = document.createElement('span'); s.className = 'ff-term' + (key ? ' ff-term--key' : '');
      s.innerHTML = btn.querySelector('svg').outerHTML + btn.dataset.name; return s;
    }
    function op(c) { var s = document.createElement('span'); s.className = 'ff-op'; s.textContent = c; return s; }
    function render() {
      out.innerHTML = '';
      out.appendChild(term(b.querySelector('[data-key]'), true)); out.appendChild(op('='));
      var on = b.querySelectorAll('.ff-builder__grid [aria-pressed="true"]');
      if (!on.length) { var h = document.createElement('span'); h.className = 'ff-op'; h.textContent = '?'; out.appendChild(h); }
      on.forEach(function (x, i) { if (i) out.appendChild(op('+')); out.appendChild(term(x)); });
    }
    b.querySelectorAll('.ff-builder__grid .ff-el').forEach(function (x) {
      x.addEventListener('click', function () { x.setAttribute('aria-pressed', x.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); render(); });
    });
    render();
  });
})();
</script>
