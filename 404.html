<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Формула свободи — сторінку не знайдено</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script>
    // GitHub Pages serves this file for any missing path. Language URLs such as
    // /english/, /index.html/english or /about.html/english are virtual: send
    // them to the real page in English instead of showing an error.
    (function () {
      var p = location.pathname;
      var m = p.match(/^(.*?)\/english\/?$/i);
      if (m) {
        var base = m[1].replace(/\/index\.html$/i, '') || '/';
        location.replace(base + (base.indexOf('?') < 0 ? '?lang=en' : '&lang=en'));
      }
    })();
  </script>
</head>
<body style="margin:0;font-family:Montserrat,-apple-system,'Segoe UI',sans-serif;color:#0a2540;background:#fff">
  <main style="max-width:560px;margin:0 auto;padding:96px 24px;text-align:center">
    <img src="/logo.png" alt="Формула свободи" style="height:56px;width:auto">
    <h1 style="font-size:32px;font-weight:800;letter-spacing:-0.03em;margin:24px 0 8px">Сторінку не знайдено</h1>
    <p style="color:#425466;margin:0 0 32px">Page not found.</p>
    <a href="/" style="display:inline-block;background:#635bff;color:#fff;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:9999px">На головну · Home</a>
  </main>
</body>
</html>
